<!doctype html>
<html lang="en" data-gc-theme="modern">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Registry-driven conformance surface for html5-game-ui-framework: every specimen is rendered and driven from one scenario declaration.">
    <title>Game UI Conformance Surface</title>
    <link rel="stylesheet" href="../src/gc.css">
    <link rel="stylesheet" href="reference.css">
    <script type="module" src="../src/gc.js"></script>
    <script type="module" src="reference.js"></script>
  </head>
  <body>
    <main class="reference-shell">
      <header class="reference-header">
        <h1 class="reference-title">Game UI Conformance Surface</h1>
        <p class="reference-lede">
          One scenario registry drives this page, the Playwright runner, the
          dependency auditor, and the computed metrics. Every specimen below is
          rendered from that single declaration; none is hand-authored here.
        </p>
        <nav class="theme-toolbar" aria-label="Theme selection" id="theme-toolbar"></nav>
      </header>

      <!-- Computed at build time by harness/metrics; populated by reference.js. -->
      <section class="reference-section" id="metrics" aria-labelledby="metrics-heading" hidden>
        <h2 class="section-heading" id="metrics-heading">Computed metrics</h2>
        <div class="metrics-grid" id="metrics-grid"></div>
      </section>

      <!-- Dependency auditor result; populated by reference.js. -->
      <section class="reference-section" id="auditor" aria-labelledby="auditor-heading" hidden>
        <h2 class="section-heading" id="auditor-heading">Dependency audit</h2>
        <div id="auditor-body"></div>
      </section>

      <!-- Every registry scenario renders here; no per-scenario markup lives in this file. -->
      <div id="scenarios"></div>
    </main>
  </body>
</html>
